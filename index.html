    :`<label class="lab" for="jA" style="margin-top:0">One piece of advice for juniors</label><textarea class="field" id="jA" rows="3" maxlength="600" placeholder="What would you tell yourself a year ago?">${esc(st.advice||"")}</textarea>

     `<p class="err" id="jErr" role="alert"></p><div class="row">${step>1?`<button type="button" class="btn" id="jBack">Back</button>`:""}<button class="btn ${step<3?"primary":"coral"}">${step<3?"Next":"Share my journey"}</button></div>`;
    if(step===1){f.querySelector("#jSt").addEventListener("click",e=>{const b=e.target.closest("[data-v]");if(!b)return;save();st.status=b.dataset.v;if(st.status==="Started a venture"&&!st.role)st.role="Founder";if(st.status!=="Started a venture"&&st.role==="Founder")st.role="";st.rounds=[];paint()});if(L.route)wirePick(f,"jRt")}

    const bk=f.querySelector("#jBack");if(bk)bk.onclick=()=>{save();step--;paint()}};
  const v=id=>(f.querySelector(id)||{value:""}).value.trim();
  const save=()=>{if(step===1){const L=jLabels(st);Object.assign(st,{route:L.route?(picked(f,"jRt")[0]||st.route):"",company:v("#jCo"),role:v("#jRo"),sector:v("#jSe"),location:v("#jLo"),ctc:"",showCtc:false})}
    if(step===2)Object.assign(st,{questions:v("#jQ"),prep:v("#jP")});if(step===3)Object.assign(st,{advice:v("#jA"),programme:v("#jPg"),batch:v("#jB"),showName:f.querySelector("#jSn").checked})};

    if(step<3){step++;paint();return}
    try{const r=await api("journey",{...st,company:st.company||"Independent"});close();toast(r&&r.held?"Thank you! It will appear after a quick check.":"Thank you! Your journey is live.");await refresh();go("journeys")}catch(x){err.textContent=x.message}});

function md(s){const lines=esc(s||"").split(/\n/);let out="",list=null;
  const inline=t=>t.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(^|\s)_(.+?)_(?=\s|$)/g,"$1<i>$2</i>").replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  lines.forEach(l=>{const b=/^\s*[-•]\s+(.*)/.exec(l),n=/^\s*\d+[.)]\s+(.*)/.exec(l),h=/^#+\s+(.*)/.exec(l);
    const want=b?"ul":n?"ol":null;if(list&&list!==want){out+=`</${list}>`;list=null}
    if(want){if(!list){out+=`<${want}>`;list=want}out+=`<li>${inline((b||n)[1])}</li>`}else if(h)out+=`<h4>${inline(h[1])}</h4>`;else if(l.trim())out+=`<p>${inline(l)}</p>`});
  if(list)out+=`</${list}>`;return out}

function nav(){const ds=$("#deskSlot");if(ds)ds.innerHTML=LV()===3?`<button class="btn small light desk-btn" data-go="desk" ${view==="desk"?'aria-current="page"':""}>${ic("edit",14)}<span>Desk</span></button>`:"";

function go(v,arg){if(v==="openings")v="drives";if(v==="drive")DRIVE_ID=arg||DRIVE_ID;if(!ALLV.includes(v)||(v==="desk"&&LV()<3))v="home";
  view=v;resetF();$("#nav").classList.remove("open");$("#menuBtn").setAttribute("aria-expanded","false");nav();render();window.scrollTo({top:0});
  if(!go._pop){const h="#"+v+(v==="drive"&&DRIVE_ID?"/"+DRIVE_ID:"");try{if(location.hash!==h||!go._init)history[go._init?"pushState":"replaceState"]({v,arg:v==="drive"?DRIVE_ID:null},"",location.pathname+location.search+h)}catch(e){}}go._init=1}
window.addEventListener("popstate",e=>{document.querySelectorAll(".scrim").forEach(s=>s.remove());const st=e.state||{};const parts=(location.hash||"").slice(1).split("/");go._pop=1;try{go(st.v||parts[0]||"home",st.arg||parts[1])}finally{go._pop=0}});

function band(k,eyebrow,title,text,actions){return `<section class="band-h" style="--c:${CAT[k][2]}"><div class="wrap">${subnav()}<div class="bh"><div><span class="eyebrow">${eyebrow}</span><h1>${title}</h1><p>${text}</p>${actions?`<div class="row" style="margin-top:16px">${actions}</div>`:""}</div>${illo(k)}</div></div></section>`}

/* every link in a text, each with the short label written just before it (e.g. "HR: <link>") */
const bodyLinks=t=>{const out=[],seen={};const re=/https?:\/\/[^\s)]+/g;let m,last=0;t=String(t||"");
  while((m=re.exec(t))){const u=m[0].replace(/[.,;:)\]]+$/,"");const before=t.slice(last,m.index).replace(/\s*:\s*$/,"");last=m.index+m[0].length;
    if(seen[u])continue;seen[u]=1;const seg=before.split(/[.:\n]/).pop().trim();out.push([seg&&seg.split(/\s+/).length<=3&&seg.length<=24?seg:"",u])}
  return out};
function shareData(ref){const [k,id]=ref.split(/:(.*)/);const cl=c=>c&&c!=="All"?(CLUSTERS[c]||[c])[0]+" students":"All departments";
  if(k==="notice"){const n=D.notices.find(x=>x.id===id);if(!n)return null;const urls=(n.body||"").match(/https?:\/\/[^\s]+/g)||[];const txt=(n.body||"").replace(/\s*https?:\/\/[^\s]+/g,"").replace(/\s+([.,:;])/g,"$1").replace(/:\s*\./g,".").trim();return {title:n.title,parts:[["what",txt],["for","For: "+cl(n.cluster)],["when","Posted: "+nice(n.date)],["link",urls.length?"Link: "+urls[0].replace(/[.,;:)\]]+$/,""):""]],links:bodyLinks(n.body)}}
  if(k==="drive"){const d=D.drives.find(x=>x.id===id);if(!d)return null;const st=d.stages||[],nx=st[doneCount(d)];
    return {title:d.company+" · "+d.role,parts:[["what",d.outcome?d.outcome+".":nx?"Next: "+nx[1]+(nx[2]?" ("+nx[2]+")":"")+".":"Status: "+d.status+"."],["for","For: "+cl(d.cluster)],["when",nx&&nx[0]?"Date: "+nice(nx[0]):"Status: "+d.status]]}}
  if(k==="event"){const e=D.events.find(x=>x.id===id);if(!e)return null;return {title:e.title,parts:[["what",(e.about||"").split(/\.\s/)[0]],["for","For: "+(e.audience||cl(e.cluster))],["when",(e.date?nice(e.date):"Date to be announced")+(e.time?", "+e.time:"")+(e.mode?" · "+e.mode:"")+(e.venue?" · "+e.venue:"")]]}}
  if(k==="opening"){const o=D.openings.find(x=>x.id===id);if(!o)return null;return {title:o.company+" · "+o.roles,parts:[["what",[o.type,o.location,o.ctc].filter(Boolean).join(" · ")],["for",o.eligibility?"Who can apply: "+o.eligibility:""],["when",o.deadline?"Apply by: "+nice(o.deadline):""],["link",o.link?"Apply: "+o.link:""]]}}
  if(k==="mentor"){const m=(D.mentors||[]).find(x=>x.id===id);if(!m)return null;const nm=nmc(m.name);
    return {title:nm+" has joined as a mentor!",tag:"Mentor spotlight",photo:m.photo||"",initials:initials(m.name),
      parts:[["what",[[m.role,m.org].filter(Boolean).join(", "),m.batch?"MSSW, batch "+m.batch:""].filter(Boolean).join(" · ")+"."]],welcomeLabel:"A NOTE FOR ALUMNI",welcome:"Your story could be exactly what a junior needs to hear. Share your journey, give advice or mentor one student. It takes a few minutes, and it stays with them for years."}}
  if(k==="bite"){const p=(D.posts||[]).find(x=>x.id===id);if(!p)return null;const urls=(p.body||"").match(/https?:\/\/[^\s]+/g)||[];return {title:p.title,parts:[["what",(p.body||"").replace(/\s*https?:\/\/[^\s]+/g,"").trim()],["for","For: "+cl(p.cluster)],["when","Posted: "+nice((p.t||"").slice(0,10))],["link",p.link?"Read more: "+p.link:urls.length?"Link: "+urls[0]:""]],links:bodyLinks((p.link?p.link+" ":"")+p.body)}}
  if(k==="post"){const p=(D.posts||[]).find(x=>x.id===id);if(!p)return null;const m=p.meta||{};
    const sum=String(p.body||"").replace(/https?:\/\/\S+/g,"").replace(/[*_#>`]/g,"").replace(/^\s*[-\d.]+\s+/gm,"").replace(/\s+/g," ").trim();
    const by="Shared by "+nmc(p.by||"MSSW alumni")+(p.byOrg?", "+p.byOrg:"");
    const urls=(p.body||"").match(/https?:\/\/[^\s)]+/g)||[];
    return {title:p.title,tag:m.subtype||(KIND[p.kind]||KIND.material)[0],parts:[["what",sum?sum+" "+by+".":(KIND[p.kind]||KIND.material)[0]+" s"+by.slice(1)],["for",p.cluster&&p.cluster!=="All"?"For: "+cl(p.cluster):""],
      ["when",[m.date&&"On: "+nice(m.date),p.deadline&&"Apply by: "+nice(p.deadline)].filter(Boolean).join(" · ")],["link",p.link?"Details: "+p.link:urls.length?"Details: "+urls[0]:""]],links:bodyLinks((p.link?p.link+" ":"")+p.body)}}
  return null}
const SHARE_KIND={bite:["Career bite","💡","home"],notice:["Notice","📢","notices"],drive:["Campus drive","💼","drives"],event:["Event","📅","events"],opening:["Opening","🧭","openings"],post:["From alumni","🤝","alumni"],mentor:["Mentor spotlight","🌟","alumni"]};
const SHARE_LAB={what:"What's happening",for:"Who it's for",when:"When"};
function wrapLines(ctx,text,maxW,maxLines){const words=String(text||"").replace(/\s+/g," ").trim().split(" ");const out=[];let line="",cut=false;
  for(const w of words){const t=line?line+" "+w:w;if(ctx.measureText(t).width<=maxW||!line)line=t;else{out.push(line);line=w;if(out.length===maxLines){cut=true;break}}}
  if(!cut&&line)out.push(line);
  if(cut){let l=out[maxLines-1];while(l&&ctx.measureText(l+"…").width>maxW)l=l.slice(0,-1);out[maxLines-1]=l.replace(/[\s,.;:]+$/,"")+"…"}
  return out}
/* card description: show only whole sentences that fit, so it never stops mid-sentence */
function fitSentences(ctx,text,maxW,maxLines){const t=String(text||"").replace(/\s+/g," ").trim();const parts=t.match(/[^.!?]+[.!?]+(\s|$)|[^.!?]+$/g)||[t];let best=null,acc="";
  for(const p of parts){const next=(acc+" "+p).trim();const ls=wrapLines(ctx,next,maxW,99);if(ls.length<=maxLines){acc=next;best=ls}else break}
