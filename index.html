<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="MSSW Career Hub: campus drives, interview and GD prep, and alumni of Madras School of Social Work.">
<meta name="theme-color" content="#120F38">
<meta property="og:type" content="website">
<meta property="og:site_name" content="MSSW Career Hub">
<meta property="og:title" content="MSSW Career Hub · Madras School of Social Work">
<meta property="og:description" content="Campus drives, notices, interview and GD prep, and alumni of MSSW, in one place.">
<meta property="og:url" content="https://mssw-career-hub.github.io/">
<meta property="og:image" content="https://mssw-career-hub.github.io/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<title>MSSW Career Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap">
<style>
/* Layout: an institutional placement office in MSSW blue. Navy bands frame each page's opening, white outlined panels hold content,
   warm coral marks the second action, and every section has its own muted colour and small animated line illustration.
   Each page uses a different arrangement: dashboard, job board, A–Z directory, story magazine, timeline, library shelves. Light-only by choice. */
:root{
  --bg:#F4F5F9; --panel:#FFFFFF; --soft:#F1F2F8; --ink:#16163A; --body:#3D3F5C; --muted:#6B6E85; --line:#D9DBE6; --line2:#E9EAF1;
  --navy:#1B1464; --navy-2:#2B2486; --navy-soft:#ECEBF7; --coral:#E46F55; --coral-2:#CF5C43; --coral-soft:#FCEDE8; --gold:#E2B04A;
  --c-ready:#13827B; --c-open:#D35A3E; --c-co:#2F57C2; --c-jo:#7A4BB0; --c-ev:#C0820F; --c-res:#2E8A55;
  --head:"Source Serif 4","Georgia",serif; --text:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px; --shadow:0 1px 2px rgba(22,22,58,.05),0 10px 26px -20px rgba(22,22,58,.35);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--text);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
a{color:var(--navy-2);text-decoration:none}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px;border-radius:6px}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
h1,h2,h3{font-family:var(--head);text-transform:uppercase;letter-spacing:.05em;font-weight:600;text-wrap:balance}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:#fff;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:#fff}
.top .wrap{display:flex;align-items:center;gap:18px;padding-block:10px}
.brand{display:flex;align-items:center;gap:11px;flex:none;text-align:left}
.brand img{width:44px;height:44px;display:block}
.brand b{display:block;font-family:var(--head);font-weight:700;font-size:1rem;letter-spacing:.06em;line-height:1.1;color:var(--navy)}
.brand small{display:block;font-size:.6rem;letter-spacing:.16em;color:var(--muted);font-weight:600;margin-top:3px}
.nav{display:flex;gap:2px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{padding:7px 11px;border-radius:8px;font-size:.86rem;font-weight:500;color:var(--body);white-space:nowrap;border:1px solid transparent}
.nav button:hover{background:var(--soft)}
.nav button[aria-current="page"]{background:var(--navy);color:#fff;font-weight:600}
.acts-top{display:flex;gap:8px;align-items:center;flex:none}
.desk-btn{border-color:var(--c-co);color:var(--c-co)}.desk-btn[aria-current="page"]{background:var(--c-co);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 15px;border-radius:9px;font-weight:600;font-size:.88rem;border:1px solid var(--line);background:#fff;color:var(--ink);transition:background .15s,border-color .15s,transform .15s}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy-2)}
.btn.coral{background:var(--coral);border-color:var(--coral);color:#fff}
.btn.coral:hover{background:var(--coral-2)}
.btn.light{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.4);color:#fff}
.btn.light:hover{background:rgba(255,255,255,.18);border-color:#fff}
.btn.small{padding:6px 11px;font-size:.8rem;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.btn[aria-pressed="true"]{background:var(--navy-soft);border-color:var(--navy);color:var(--navy)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.78rem;color:#fff;background:var(--c,var(--navy));flex:none}
.menu-btn{display:none}
.link{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:.8rem;color:var(--ink)}
.link:hover{border-color:var(--ink)}

/* hero (home) */
.hero{background:linear-gradient(120deg,#130E4E 0%,var(--navy) 45%,#2D2690 100%);color:#fff;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-120px;top:-160px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(228,111,85,.28),transparent 65%)}
.hero .hrow{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:36px;align-items:center;padding-block:44px 34px}
.hero .eyebrow{color:#C9C6EE;display:flex;align-items:center;gap:10px}
.hero .eyebrow img{width:30px;height:30px}
.hero h1{font-size:clamp(1.5rem,2.7vw,2.1rem);line-height:1.22;margin:14px 0 14px;letter-spacing:.04em;color:#fff}
.hero h1 span{color:#FFB9A6}
.hero p{margin:0 0 24px;color:#DCDAF4;max-width:54ch;font-size:1rem}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap}
.stats{position:relative;z-index:1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid rgba(255,255,255,.14)}
.stats button{padding:16px 18px;text-align:left;border-right:1px solid rgba(255,255,255,.14);color:#fff;transition:background .15s}
.stats button:last-child{border-right:0}
.stats button:hover{background:rgba(255,255,255,.06)}
.stats b{display:block;font-family:var(--head);font-size:1.5rem;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.stats small{font-size:.78rem;color:#C9C6EE}
.illo{width:100%;height:auto;display:block;overflow:visible}
.illo .draw{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 2.4s .3s cubic-bezier(.4,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.illo .float{animation:float 6s ease-in-out infinite}
.illo .float.d2{animation-delay:-2s}.illo .float.d3{animation-delay:-4s}
@keyframes float{50%{transform:translateY(-6px)}}
.illo .travel{offset-rotate:0deg;animation:travel 7s ease-in-out infinite}
@keyframes travel{0%{offset-distance:0%}55%,100%{offset-distance:100%}}
.illo .pop{transform-box:fill-box;transform-origin:center;animation:pop 3s ease-in-out infinite}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}

/* sections */
main{padding-bottom:56px}
.sec{margin-top:40px}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.sec-h .t{display:flex;gap:12px;align-items:center;min-width:0}
.sec-h h2{margin:0;font-size:1.05rem;color:var(--ink)}
.sec-h p{margin:2px 0 0;color:var(--muted);font-size:.86rem;text-transform:none;letter-spacing:0;font-family:var(--text)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.sq{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 10%,#fff);border:1px solid color-mix(in srgb,var(--c) 24%,#fff);flex:none}

/* how it works */
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.how div{padding:18px 20px;border-radius:var(--r);background:#fff;border:1px solid var(--line);display:grid;grid-template-columns:56px minmax(0,1fr);gap:14px;align-items:start}
.how .illo{width:56px}
.how .k{font-size:.7rem;letter-spacing:.14em;color:var(--coral-2);font-weight:700;text-transform:uppercase}
.how b{display:block;margin:2px 0 4px;font-size:.98rem}
.how small{color:var(--body);font-size:.86rem;line-height:1.5;display:block}

/* explore tiles */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tile{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:10px;text-align:left;padding:18px;border-radius:var(--r);background:#fff;border:1px solid var(--line);transition:border-color .2s,transform .2s,box-shadow .2s}
.tile:hover{border-color:var(--c);transform:translateY(-2px);box-shadow:var(--shadow)}
.tile b{display:block;font-size:1rem;color:var(--ink)}
.tile small{display:block;color:var(--body);font-size:.84rem;line-height:1.45;margin-top:4px}
.tile .n{display:inline-block;margin-top:10px;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--c);padding:3px 8px;border-radius:6px;background:color-mix(in srgb,var(--c) 9%,#fff)}
.tile .illo{width:84px;align-self:center}

/* lists */
.list{border:1px solid var(--line);border-radius:var(--r);background:#fff;overflow:hidden}
.li{position:relative;display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line2);text-align:left;width:100%}
.li:last-child{border-bottom:0}
.li:hover{background:#FAFAFD}
.li .open{position:absolute;inset:0}
.li b{display:block;font-size:.95rem;line-height:1.35}
.li small{display:block;color:var(--muted);font-size:.82rem}
.li .side{text-align:right;font-size:.8rem;color:var(--muted);white-space:nowrap;position:relative}
.list-foot{padding:10px 16px;background:var(--soft);border-top:1px solid var(--line2);display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.82rem;color:var(--muted)}
.list-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--c) 6%,#fff)}
.list-h h3{margin:0;font-size:.82rem;letter-spacing:.1em;color:var(--c)}

/* cards */
.cards{display:grid;gap:14px}
.card{position:relative;display:flex;flex-direction:column;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;transition:border-color .15s,box-shadow .2s}
.card:hover{border-color:#A3A6BC;box-shadow:var(--shadow)}
.card .open{position:absolute;inset:0;border-radius:var(--r)}
.org{display:flex;align-items:center;gap:12px;min-width:0}
.mono{flex:none;width:42px;height:42px;border-radius:9px;display:grid;place-items:center;font-family:var(--head);font-weight:700;font-size:.85rem;color:#fff;background:var(--c)}
.org b{display:block;font-size:.97rem;line-height:1.3}
.org small{display:block;color:var(--muted);font-size:.8rem}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:6px;font-size:.72rem;font-weight:600;border:1px solid var(--line);color:var(--body);background:#fff;white-space:nowrap}
.chip.dot::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c,var(--muted))}
.chip.fill{background:color-mix(in srgb,var(--c) 10%,#fff);border-color:color-mix(in srgb,var(--c) 25%,#fff);color:var(--c)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.sample{border-style:dashed;color:var(--muted)}
.kv{display:flex;gap:8px;align-items:flex-start;font-size:.84rem;color:var(--body);margin-top:8px}
.kv svg{flex:none;margin-top:3px;color:var(--muted)}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:12px;font-size:.78rem;color:var(--muted)}
.card .btn{position:relative;z-index:1}
.steps-mini{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px;font-size:.75rem;color:var(--muted)}
.steps-mini span:not(:last-child)::after{content:"→";margin-left:6px;color:#A6A9BE}

/* journey card */
.jc{padding:0;overflow:hidden}
.jc-top{display:flex;align-items:center;gap:12px;padding:16px}
.jc .who b{display:block;font-size:.98rem}
.jc .who small{color:var(--muted);font-size:.8rem}
.jc-mid{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);background:#FAFAFD}
.jc-mid b{font-size:.86rem}
.ctc{font-family:var(--head);font-weight:700;font-size:1.05rem;color:var(--navy);white-space:nowrap;text-align:right}
.ctc small{display:block;font-family:var(--text);font-weight:600;font-size:.6rem;letter-spacing:.12em;color:var(--muted)}
.jc q{display:block;padding:12px 16px 0;color:var(--body);font-size:.88rem;line-height:1.5;font-style:italic;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.jc .card-foot{padding:12px 16px 14px}
.share-card{display:flex;flex-direction:column;justify-content:center;gap:10px;padding:20px;border-radius:var(--r);background:linear-gradient(150deg,var(--navy),#2D2690);color:#fff;position:relative;overflow:hidden}
.share-card .illo{position:absolute;right:-10px;bottom:-6px;width:120px;opacity:.9}
.share-card h3{margin:0;font-size:.92rem;line-height:1.45;color:#fff;position:relative}
.share-card p{margin:0;font-size:.88rem;color:#DCDAF4;position:relative;max-width:30ch}
.share-card .btn{align-self:flex-start;position:relative}

/* event */
.date{flex:none;width:50px;border-radius:8px;overflow:hidden;text-align:center;border:1px solid var(--line);background:#fff}
.date small{display:block;background:var(--c,var(--c-ev));color:#fff;font-size:.62rem;font-weight:700;letter-spacing:.1em;padding:2px 0}
.date b{display:block;font-family:var(--head);font-size:1.25rem;padding:2px 0 3px}

/* readiness */
.ring{position:relative;width:140px;height:140px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .t b{font-family:var(--head);font-size:1.6rem;display:block;line-height:1}
.ring .t small{color:var(--muted);font-size:.78rem}
.ring circle{fill:none;stroke-width:10}
.ring .bgc{stroke:var(--line2)}
.ring .fg{stroke:var(--c-ready);stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.3,1)}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:1px}
.checks button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:5px 6px;border-radius:6px;font-size:.88rem}
.checks button:hover{background:var(--soft)}
.box{flex:none;width:18px;height:18px;border-radius:4px;border:1.5px solid #9EA1B8;display:grid;place-items:center;font-style:normal;color:#fff;font-size:.66rem;transition:all .15s}
[aria-pressed="true"]>.box{background:var(--c-ready);border-color:var(--c-ready)}
.checks [aria-pressed="true"] span{color:var(--muted)}
.ready-home{display:grid;grid-template-columns:150px minmax(0,1fr);gap:20px;align-items:center;padding:18px}

/* readiness page: dashboard */
.dash{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start;margin-top:22px}
.dash-side{position:sticky;top:calc(80px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:14px}
.progress{padding:20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.cats{padding:8px}
.cats button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:9px 10px;border-radius:8px;font-size:.88rem;text-align:left}
.cats button:hover{background:var(--soft)}
.cats .meter{width:60px;height:6px;border-radius:6px;background:var(--line2);overflow:hidden}
.cats .meter em{display:block;height:100%;background:var(--c-ready)}
.rtable{border:1px solid var(--line);border-radius:var(--r);background:#fff;overflow:hidden;margin-bottom:16px;scroll-margin-top:90px}
.rtable .head{display:flex;align-items:center;gap:12px;padding:14px 16px;background:color-mix(in srgb,var(--c) 7%,#fff);border-bottom:1px solid var(--line)}
.rtable .head h3{margin:0;font-size:.86rem;letter-spacing:.1em;color:var(--c)}
.rtable .head>span:last-child{margin-left:auto;font-size:.8rem;color:var(--muted);font-weight:600}
.rrow{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:12px;align-items:start;width:100%;text-align:left;padding:12px 16px;border-bottom:1px solid var(--line2)}
.rrow:last-child{border-bottom:0}
.rrow:hover{background:#FAFAFD}
.rrow .box{margin-top:2px}
.rrow[aria-pressed="true"] b{color:var(--muted);text-decoration:none}
.rrow b{display:block;font-size:.92rem;font-weight:600}
.rrow small{color:var(--muted);font-size:.82rem;display:block}
.rrow .tag{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--coral-2);white-space:nowrap}
.studio{border:1px solid var(--line);border-radius:var(--r);background:#fff;overflow:hidden;margin-bottom:16px}
.studio-top{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:16px;padding:20px;background:linear-gradient(120deg,var(--coral-soft),#fff 70%);border-bottom:1px solid var(--line)}
.studio-top h3{margin:0 0 6px;font-size:.95rem;color:var(--coral-2)}
.studio-top p{margin:0;color:var(--body);font-size:.9rem}
.tpl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tpl a,.tpl div{display:flex;flex-direction:column;gap:6px;padding:16px;border-right:1px solid var(--line2);color:var(--ink)}
.tpl>:last-child{border-right:0}
.tpl a:hover{background:#FAFAFD}
.tpl .page{width:56px;height:72px;border:1px solid var(--line);border-radius:4px;background:#fff;padding:7px 6px;display:flex;flex-direction:column;gap:3px;box-shadow:0 4px 10px -6px rgba(22,22,58,.3)}
.tpl .page i{display:block;height:3px;border-radius:2px;background:#D5D7E4}
.tpl .page i:first-child{height:5px;width:70%;background:var(--navy)}
.tpl .page i.c{background:var(--coral);width:40%}
.tpl b{font-size:.86rem;line-height:1.35}
.tpl small{font-size:.78rem;color:var(--muted);line-height:1.4}
.tips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line2)}
.tips div{padding:14px 16px;border-right:1px solid var(--line2);font-size:.85rem;color:var(--body)}
.tips div:last-child{border-right:0}
.tips b{display:block;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--navy);margin-bottom:2px}

/* page band (each section has its own) */
.band-h{background:linear-gradient(115deg,color-mix(in srgb,var(--c) 92%,#000) 0%,var(--c) 60%,color-mix(in srgb,var(--c) 75%,#fff) 100%);color:#fff;position:relative;overflow:hidden}
.band-h .wrap{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:24px;align-items:center;padding-block:28px 26px;position:relative;z-index:1}
.band-h .eyebrow{color:rgba(255,255,255,.78)}
.band-h h1{font-size:clamp(1.3rem,2.3vw,1.7rem);margin:6px 0 8px;color:#fff}
.band-h p{margin:0 0 14px;color:rgba(255,255,255,.88);max-width:62ch}
.band-h .illo{width:220px}
.band-h .btn.coral{background:#fff;border-color:#fff;color:var(--c)}
.band-h .btn.coral:hover{background:#F6F6FB}

/* toolbar */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:20px 0 16px}
.search{flex:1 1 240px;display:flex;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:#fff;min-width:0}
.search:focus-within{border-color:var(--navy)}
.search input{border:0;outline:0;padding:9px 0;width:100%;background:transparent}
.seg{display:flex;gap:0;flex-wrap:wrap;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
.seg button{padding:7px 12px;font-size:.82rem;font-weight:500;color:var(--body);border-right:1px solid var(--line2)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.field{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:#fff}
.field:focus{outline:0;border-color:var(--navy);box-shadow:0 0 0 3px var(--navy-soft)}
select.field{appearance:auto}
.empty{padding:30px 20px;text-align:center;border:1px dashed #BDC0D3;border-radius:var(--r);background:#fff;color:var(--body);grid-column:1/-1}
.empty b{display:block;font-family:var(--head);text-transform:uppercase;letter-spacing:.06em;font-size:.88rem;margin-bottom:6px;color:var(--ink)}
.note{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:9px;background:#fff;border:1px dashed #BDC0D3;font-size:.85rem;color:var(--body);margin-top:18px}

/* openings: job board */
.board{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;margin-top:22px;align-items:start}
.filters{border:1px solid var(--line);border-radius:var(--r);background:#fff;padding:6px 0;position:sticky;top:calc(80px + env(safe-area-inset-top,0px))}
.filters h3{margin:10px 16px 6px;font-size:.72rem;letter-spacing:.12em;color:var(--muted)}
.filters button{display:flex;justify-content:space-between;width:100%;padding:7px 16px;font-size:.87rem;text-align:left;color:var(--body)}
.filters button:hover{background:var(--soft)}
.filters button[aria-pressed="true"]{color:var(--c-open);font-weight:700;background:color-mix(in srgb,var(--c-open) 7%,#fff);box-shadow:inset 3px 0 0 var(--c-open)}
.filters button span{color:var(--muted);font-weight:500}
.job{position:relative;display:grid;grid-template-columns:48px minmax(0,1fr) 170px;gap:16px;align-items:start;padding:16px;border-bottom:1px solid var(--line2)}
.job:last-child{border-bottom:0}
.job:hover{background:#FAFAFD}
.job .open{position:absolute;inset:0}
.job .mono{width:48px;height:48px}
.job b{display:block;font-size:1rem}
.job .meta{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:4px;font-size:.82rem;color:var(--muted)}
.job .meta span{display:inline-flex;gap:5px;align-items:center}
.job .right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:.8rem;color:var(--muted)}

/* companies: A–Z */
.az{display:flex;flex-wrap:wrap;gap:4px;margin:20px 0 6px}
.az button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:.82rem;color:var(--body)}
.az button:disabled{opacity:.35;cursor:default}
.az button[aria-pressed="true"]{background:var(--c-co);border-color:var(--c-co);color:#fff}
.letter{display:grid;grid-template-columns:60px minmax(0,1fr);gap:16px;padding:18px 0;border-bottom:1px solid var(--line)}
.letter>b{font-family:var(--head);font-size:2rem;color:var(--c-co);line-height:1}
.co{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:12px}

/* journeys: magazine */
.feature{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);border:1px solid var(--line);border-radius:var(--r);background:#fff;overflow:hidden;margin-top:22px;position:relative}
.feature .open{position:absolute;inset:0}
.feature .l{padding:26px;display:flex;flex-direction:column;gap:10px}
.feature blockquote{margin:6px 0;font-family:var(--head);font-size:1.25rem;line-height:1.45;color:var(--ink);font-style:italic}
.feature .r{background:linear-gradient(140deg,#3A2470,var(--c-jo));color:#fff;padding:26px;display:flex;flex-direction:column;justify-content:space-between;gap:16px}
.feature .r .illo{width:100%;max-width:260px;align-self:center}
.feature .stat{display:flex;justify-content:space-between;border-top:1px solid rgba(255,255,255,.22);padding-top:12px;gap:10px}
.feature .stat b{display:block;font-family:var(--head);font-size:1.3rem}
.feature .stat small{color:rgba(255,255,255,.75);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:22px 0 14px;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:.83rem;font-weight:500;color:var(--body)}
.tabs button[aria-pressed="true"]{background:var(--c-jo);border-color:var(--c-jo);color:#fff}

/* events: timeline */
.tl{position:relative;margin-top:22px}
.month{display:grid;grid-template-columns:120px minmax(0,1fr);gap:20px;margin-bottom:22px}
.month>h3{margin:6px 0 0;font-size:.85rem;letter-spacing:.12em;color:var(--c-ev)}
.month>h3 small{display:block;font-family:var(--text);letter-spacing:0;text-transform:none;color:var(--muted);font-weight:500;font-size:.8rem}
.tl-items{position:relative;display:flex;flex-direction:column;gap:12px;padding-left:24px;border-left:2px solid color-mix(in srgb,var(--c-ev) 25%,#fff)}
.evt{position:relative;display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:#fff}
.evt::before{content:"";position:absolute;left:-32px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:#fff;border:3px solid var(--c-ev)}
.evt .open{position:absolute;inset:0;border-radius:var(--r)}
.evt .day{text-align:center;line-height:1.1}
.evt .day b{display:block;font-family:var(--head);font-size:1.6rem;color:var(--ink)}
.evt .day small{font-size:.7rem;letter-spacing:.1em;color:var(--muted);font-weight:700;text-transform:uppercase}
.evt .k{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--c-ev)}
.evt b.t{display:block;font-size:1rem;margin:2px 0}
.evt .act{position:relative;display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:.78rem;color:var(--muted)}
.seats{width:120px;height:6px;border-radius:6px;background:var(--line2);overflow:hidden}
.seats em{display:block;height:100%;background:var(--c-ev)}

/* resources: shelves */
.shelf{margin-top:26px}
.shelf-h{display:flex;align-items:center;gap:10px;padding-bottom:10px;margin-bottom:12px;border-bottom:2px solid color-mix(in srgb,var(--c-res) 25%,#fff)}
.shelf-h h3{margin:0;font-size:.86rem;letter-spacing:.1em}
.shelf-h span{margin-left:auto;font-size:.8rem;color:var(--muted)}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:12px}
.book{position:relative;display:flex;flex-direction:column;gap:6px;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:#fff;text-align:left;transition:border-color .15s,transform .15s}
.book:hover{border-color:var(--c-res);transform:translateY(-2px)}
.book .open{position:absolute;inset:0}
.book b{font-size:.92rem;line-height:1.35}
.book small{color:var(--muted);font-size:.8rem}
.leader{counter-reset:n}
.leader .li{grid-template-columns:30px 38px minmax(0,1fr) auto}
.leader .li::before{counter-increment:n;content:counter(n);font-family:var(--head);font-weight:700;font-size:1.1rem;color:var(--c-res);text-align:center}

/* pathways + steps + contribute (home) */
.paths{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.path{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 16px;text-align:left;border:1px solid var(--line);border-radius:var(--r);background:#fff;transition:border-color .15s}
.path:hover{border-color:var(--c)}
.path .sq{width:38px;height:38px}
.path b{display:block;font-size:.92rem;line-height:1.3}
.path small{display:block;color:var(--muted);font-size:.8rem;line-height:1.4}
.path .cnt{font-family:var(--head);font-weight:600;font-size:1.1rem;color:var(--ink);text-align:right}
.path .cnt small{font-family:var(--text);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase}
.steps4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));position:relative}
.steps4::before{content:"";position:absolute;left:12%;right:12%;top:31px;height:2px;background:repeating-linear-gradient(90deg,var(--line) 0 8px,transparent 8px 14px)}
.s4{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:0 12px}
.s4 .n{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:#fff;border:2px solid var(--c);color:var(--c);font-family:var(--head);font-weight:700;font-size:1.2rem;transition:transform .2s,background .2s}
.s4:hover .n{transform:translateY(-3px);background:var(--c);color:#fff}
.s4 b{font-size:.95rem}
.s4 small{color:var(--body);font-size:.84rem;line-height:1.45}
.contrib{margin-top:40px;border-radius:var(--r);background:linear-gradient(115deg,var(--coral-soft),#fff 55%,var(--navy-soft));border:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);overflow:hidden}
.contrib .l{padding:26px;display:grid;grid-template-columns:90px minmax(0,1fr);gap:16px;align-items:center}
.contrib h2{margin:0 0 8px;font-size:1.02rem;line-height:1.45;color:var(--navy)}
.contrib p{margin:0;color:var(--body);font-size:.92rem}
.contrib .opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:#fff;border-left:1px solid var(--line)}
.contrib .opts button{display:flex;gap:12px;align-items:center;text-align:left;padding:18px 20px;font-weight:600;font-size:.9rem;border-bottom:1px solid var(--line2);border-right:1px solid var(--line2)}
.contrib .opts button:nth-child(2n){border-right:0}
.contrib .opts button:nth-child(n+3){border-bottom:0}
.contrib .opts button:hover{background:#FAFAFD}

/* drawer */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(22,22,58,.36);display:flex;justify-content:flex-end;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.drawer{width:min(560px,100%);height:100%;overflow-y:auto;background:var(--bg);animation:slide .28s cubic-bezier(.2,.8,.3,1);padding:0 0 calc(40px + env(safe-area-inset-bottom,0px));border-left:1px solid var(--line)}
@keyframes slide{from{transform:translateX(24px);opacity:.5}}
.dh{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px max(20px,env(safe-area-inset-right,0px)) 12px 20px;background:var(--navy);color:#fff}
.dh .eyebrow{color:#C9C6EE}
.x{width:34px;height:34px;border-radius:8px;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;font-size:.95rem}
.db{padding:20px max(20px,env(safe-area-inset-right,0px)) 0 20px}
.db h2{font-size:1.1rem;line-height:1.4;margin:4px 0 8px}
.db h3{font-size:.78rem;letter-spacing:.1em;margin:22px 0 8px;color:var(--navy)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:0;border-radius:var(--r);background:#fff;border:1px solid var(--line);font-size:.9rem;margin-top:14px;overflow:hidden}
.facts dt,.facts dd{padding:9px 14px;border-bottom:1px solid var(--line2);margin:0}
.facts dt{color:var(--muted);font-size:.8rem;font-weight:600;background:#FAFAFD;border-right:1px solid var(--line2)}
.facts dt:nth-last-child(2),.facts dd:last-child{border-bottom:0}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.timeline li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding-bottom:12px;position:relative}
.timeline li::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:1px;background:var(--line)}
.timeline li:last-child::before{display:none}
.timeline i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:.78rem;border:1px solid var(--navy);color:var(--navy);background:#fff}
.timeline span{padding-top:3px}
.prose{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;white-space:pre-wrap;color:var(--body);font-size:.92rem}
.qa{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:8px}
.qa li{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:.9rem}
.qa small{display:block;color:var(--muted);font-size:.75rem;font-weight:600}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lab{display:block;font-size:.84rem;font-weight:600;margin:14px 0 6px}
.lab small{color:var(--muted);font-weight:400}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:#B3261E;font-size:.86rem;min-height:1.2em;margin:10px 0 0}
.stepper{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:4px 0 14px;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
.stepper span{padding:7px 10px;font-size:.75rem;font-weight:600;color:var(--muted);border-right:1px solid var(--line2)}
.stepper span:last-child{border-right:0}
.stepper span.on{background:var(--navy);color:#fff}
.pick{display:flex;gap:6px;flex-wrap:wrap}
.pick button{padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:.84rem}
.pick button[aria-pressed="true"]{background:var(--navy-soft);border-color:var(--navy);color:var(--navy);font-weight:600}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:.88rem}
.check input{margin-top:3px;accent-color:var(--navy)}
.encourage{display:flex;gap:10px;align-items:center;padding:11px 14px;border-radius:9px;background:var(--coral-soft);border:1px solid #F4CFC4;color:var(--coral-2);font-size:.88rem;font-weight:600;margin-bottom:10px}
.hint{font-size:.82rem;color:var(--muted);margin:6px 0 0}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--ink);color:#fff;padding:10px 16px;border-radius:9px;font-size:.9rem;animation:fade .2s;max-width:calc(100% - 32px)}
footer{background:var(--navy);color:#C9C6EE;margin-top:48px}
footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding-block:22px;font-size:.84rem}
footer .f{display:flex;gap:12px;align-items:center}
footer img{width:40px;height:40px}
footer b{color:#fff;font-family:var(--head);letter-spacing:.06em}
.live-dot{display:inline-flex;align-items:center;gap:6px}
.live-dot i{width:7px;height:7px;border-radius:50%;background:#8E8BB8}
.live-dot.on i{background:#5BD39A}

.lock{display:flex;gap:16px;align-items:flex-start;padding:22px;border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(135deg,#fff,#F7F6FD);color:var(--navy)}
.lock>svg{flex:none;margin-top:2px}
.lock b{display:block;font-family:var(--head);text-transform:uppercase;letter-spacing:.06em;font-size:.95rem;color:var(--ink)}
.lock p{margin:6px 0 14px;color:var(--body);max-width:62ch;font-size:.92rem}
.lock.sm{padding:14px 16px}.lock.sm b{font-size:.82rem}.lock.sm p{margin:4px 0 10px;font-size:.86rem}
.levels{list-style:none;margin:12px 0 4px;padding:0;display:grid;gap:8px}
.levels li{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#FAFAFD;font-size:.86rem}
.levels b{display:block;color:var(--ink)}.levels span{color:var(--body)}
.desk-acts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:24px}
.desk-act{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;padding:18px 16px;border-radius:var(--r);border:1px solid var(--line);background:#fff;border-top:3px solid var(--c);transition:transform .2s,box-shadow .2s}
.desk-act:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.desk-act b{display:block;font-size:.95rem}.desk-act small{display:block;color:var(--muted);font-size:.8rem;line-height:1.4;margin-top:2px}
.desk-act>svg{color:var(--c)}
.desk-li{grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center}
.steps-ed{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.se{display:grid;grid-template-columns:24px 150px minmax(0,1fr) minmax(0,1fr) 32px;gap:6px;align-items:center}
.se .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.72rem;font-weight:700;background:var(--soft);color:var(--navy)}
.se .field{margin:0;padding:8px 10px;font-size:.86rem}
.se .x{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);font-size:1.1rem;color:var(--muted)}
.teamx{margin-top:18px;padding:14px;border:1px dashed color-mix(in srgb,var(--c-co) 45%,#fff);border-radius:12px;background:color-mix(in srgb,var(--c-co) 4%,#fff)}
.teamx .tx{font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--c-co)}
.pv{display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:.76rem;color:rgba(255,255,255,.75)}
.pv button{padding:4px 9px;border-radius:999px;border:1px solid rgba(255,255,255,.3);color:#fff;font-size:.74rem}
.pv button:hover{background:rgba(255,255,255,.12)}
@media (max-width:1080px){.desk-acts{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.desk-acts{grid-template-columns:1fr}.se{grid-template-columns:24px minmax(0,1fr) 32px}.se [type=date]{grid-column:2}.se .s1,.se .s2{grid-column:2}.se .x{grid-row:1;grid-column:3}}
.isle{position:relative;display:flex;flex-direction:column;min-height:clamp(600px,86vh,800px);color:#fff;overflow:hidden;background:#100D3A}
.isle-sky{position:absolute;inset:0;background:radial-gradient(ellipse at 18% 90%,rgba(228,111,85,.22),transparent 55%),linear-gradient(180deg,#0B0930 0%,#16114F 55%,#2A2287 100%)}
.isle-sky .moon{position:absolute;right:7%;top:6%;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#FFF8EA,#F3E2C3 60%,#E9D2AE);box-shadow:0 0 60px 20px rgba(255,236,200,.22),0 0 160px 60px rgba(255,236,200,.08);opacity:.92}
.isle-sky .stars{position:absolute;inset:0;background-image:radial-gradient(1.4px 1.4px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 90px 120px,#fff,transparent),radial-gradient(1.2px 1.2px at 160px 60px,#DCD8FF,transparent),radial-gradient(1px 1px at 230px 170px,#fff,transparent),radial-gradient(1.6px 1.6px at 300px 90px,#FFE9DD,transparent),radial-gradient(1px 1px at 60px 200px,#fff,transparent);background-size:320px 230px;opacity:.75;animation:twinkle 5s ease-in-out infinite alternate}
.isle-sky .stars.s2{background-size:470px 330px;background-position:110px 70px;opacity:.45;animation-duration:7s;animation-delay:-3s}
@keyframes twinkle{from{opacity:.35}to{opacity:.85}}
.isle-copy{position:relative;z-index:4;width:100%;max-width:1200px;margin:0 auto;padding:44px max(16px,env(safe-area-inset-left,0px)) 0;pointer-events:none}
.isle-copy>*{pointer-events:auto}.isle-copy p,.isle-copy h1{max-width:30ch}
.isle-copy .eyebrow{color:#C9C6EE;display:flex;align-items:center;gap:10px}.isle-copy .eyebrow img{width:30px;height:30px}
.isle-copy h1{font-size:clamp(1.7rem,3.4vw,2.7rem);line-height:1.14;margin:16px 0 12px;letter-spacing:.04em;color:#fff;max-width:16ch}
.isle-copy h1 span{color:#FFB9A6}
.isle-copy p{margin:0 0 20px;color:#DCDAF4;max-width:36ch}
.isle-copy .cta{display:flex;gap:10px;flex-wrap:wrap}
.isle-mount{position:absolute;inset:0;z-index:2}
.isle-stage{position:absolute;inset:0}
.isle-cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:pan-y}
.isle-cv:active{cursor:grabbing}
.isle-pins{position:absolute;inset:0;pointer-events:none;transition:opacity .6s}
.isle-stage:not(.live):not(.flat) .isle-pins{opacity:0}
.pin{position:absolute;left:0;top:0;display:flex;align-items:center;gap:8px;margin:-11px 0 0 -11px;pointer-events:auto;transition:opacity .25s;will-change:transform}
.pin i{flex:none;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle,#fff 0 3px,var(--coral) 4px);box-shadow:0 0 0 0 rgba(228,111,85,.6);animation:pinpulse 2.2s infinite}
@keyframes pinpulse{0%{box-shadow:0 0 0 0 rgba(228,111,85,.55)}70%{box-shadow:0 0 0 14px rgba(228,111,85,0)}100%{box-shadow:0 0 0 0 rgba(228,111,85,0)}}

/* ===== Premium layer: glass panels, glossy buttons, finer type (Nov 2026 redesign) ===== */
:root{
  --bg:#F4F2FB; --panel:#FFFFFF; --soft:#F1EEFA; --ink:#1A1640; --body:#4A4670; --muted:#7C7898; --line:#E7E3F4; --line2:#EFECF8;
  --navy:#120F38; --navy-2:#2E2868; --navy-soft:#ECE8FA; --coral:#E8573A; --coral-2:#C2412A; --coral-soft:#FFEDE7; --violet:#6446EE;
  --head:"Plus Jakarta Sans",system-ui,sans-serif; --text:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:22px; --shadow:inset 0 1px 0 #fff,0 1px 2px rgba(30,20,90,.04),0 24px 48px -30px rgba(40,25,120,.35);
  --glass:linear-gradient(160deg,rgba(255,255,255,.94),rgba(255,255,255,.7));
}
html,body{background:var(--bg)}
body{font-size:14.5px;line-height:1.65;color:var(--ink)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(520px 420px at 8% 30%,rgba(196,180,255,.45),transparent 70%),radial-gradient(480px 420px at 95% 55%,rgba(255,200,186,.42),transparent 70%),radial-gradient(460px 380px at 40% 95%,rgba(176,236,214,.4),transparent 70%)}
h1,h2,h3{font-family:var(--head);font-weight:700;letter-spacing:.04em}
.eyebrow{font-size:11px;letter-spacing:.22em;font-weight:600}
a{color:#4A32C7}

/* top bar */
.top{position:sticky;top:10px;margin:10px 12px 0;border-radius:22px;background:rgba(18,15,56,.92);border:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 18px 40px -24px rgba(18,15,56,.8);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
body::before{background:var(--bg)}
.top .wrap{max-width:1400px;padding-block:10px}
.brand b{color:#fff;font-family:var(--head);font-size:13px;letter-spacing:.16em;font-weight:700}
.brand small{color:#B5B0E2;font-size:9.5px}
.brand img{width:38px;height:38px;filter:brightness(0) invert(1)}
.nav{background:rgba(255,255,255,.06);border-radius:999px;padding:4px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.nav button{color:#CFCBEF;font-size:13px;font-weight:500;border-radius:999px;padding:7px 14px;border:0}
.nav button:hover{background:rgba(255,255,255,.08);color:#fff}
.nav button[aria-current="page"]{color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,.08));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 14px -6px rgba(124,92,255,.9);font-weight:600}
.menu-btn{color:#fff;border-color:rgba(255,255,255,.2)!important}
.avatar{box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}

/* buttons */
.btn{border-radius:999px;font-weight:600;font-size:13.5px;padding:10px 18px;border:0;background:var(--glass);color:var(--ink);box-shadow:inset 0 1px 0 #fff,inset 0 0 0 1px var(--line),0 6px 16px -12px rgba(40,25,120,.5)}
.btn:hover{border-color:transparent;box-shadow:inset 0 1px 0 #fff,inset 0 0 0 1px #CFC6F2,0 8px 18px -10px rgba(40,25,120,.5)}
.btn.coral{color:#fff;background:linear-gradient(180deg,#FF8E72,#E8573A);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 0 rgba(0,0,0,.08),0 10px 24px -10px rgba(232,87,58,.75)}
.btn.coral:hover{background:linear-gradient(180deg,#FF9A80,#EC6143);filter:none}
.btn.primary{color:#fff;background:linear-gradient(180deg,#9A82FF,#6446EE);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -2px 0 rgba(0,0,0,.1),0 10px 24px -10px rgba(100,70,238,.8)}
.btn.primary:hover{background:linear-gradient(180deg,#A58FFF,#6E52F2)}
.btn.dark{color:#fff;background:linear-gradient(180deg,#2E2868,#15123F);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 10px 22px -12px rgba(18,15,56,.8)}
.btn.light{color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.05));box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 0 0 1px rgba(255,255,255,.14)}
.btn.light:hover{background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.08))}
.btn.wa{color:#fff;background:linear-gradient(180deg,#3FD97A,#1A9E54);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 0 rgba(0,0,0,.08),0 10px 24px -10px rgba(26,158,84,.8)}
.btn.small{padding:7px 13px;font-size:12.5px;border-radius:999px}
.btn.ghost{background:transparent;box-shadow:none;color:var(--muted)}
.btn[aria-pressed="true"]{background:linear-gradient(180deg,#F3EFFF,#E4DBFF);color:#4A32C7;box-shadow:inset 0 1px 0 #fff,0 0 0 1.5px #8F76FF}
.link{border-radius:999px;border:0;background:var(--glass);box-shadow:inset 0 1px 0 #fff,inset 0 0 0 1px var(--line);font-size:12.5px;padding:7px 13px}
.share{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--text);color:#137A41;background:linear-gradient(180deg,#F0FCF4,#D7F5E2);border-radius:999px;padding:7px 12px;box-shadow:inset 0 1px 0 #fff,0 0 0 1px #BFE9CF;position:relative;z-index:2}
.share:hover{background:linear-gradient(180deg,#E6FAEE,#CBF1DA)}

/* glass surfaces */
.panel,.list,.card,.tile,.empty,.rtable,.guide,.drive,.lock,.desk-act,.clbar,.door2,.gl{background:var(--glass)!important;border:1px solid rgba(255,255,255,.9)!important;box-shadow:var(--shadow)!important;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:var(--r)}
.list{overflow:hidden}
.li{border-color:var(--line2)!important}
.li:hover{background:rgba(243,239,255,.55)}
.chip{border-radius:999px;border-color:var(--line);padding:3px 10px}
.field{border-radius:12px;border-color:var(--line);background:rgba(255,255,255,.85)}
.field:focus{border-color:#8F76FF;box-shadow:0 0 0 3px rgba(143,118,255,.18);outline:0}
.pick button{border-radius:999px}
.pick button[aria-pressed="true"]{background:linear-gradient(180deg,#F3EFFF,#E4DBFF);border-color:#8F76FF;color:#4A32C7}
.mono{border-radius:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.sq{border-radius:50%}
.scrim{background:rgba(18,15,56,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.drawer{background:linear-gradient(160deg,rgba(255,255,255,.98),rgba(246,243,255,.96));border-radius:26px 0 0 26px;box-shadow:-30px 0 60px -30px rgba(18,15,56,.6)}
.drawer.wide{width:min(1120px,100vw)}
.toast{border-radius:999px;background:linear-gradient(180deg,#2E2868,#15123F)}
.sec{margin-top:56px}
.sec-h h2{font-size:20px}
.sec-h p{font-size:13.5px}

/* page header band: dark glass panel */
.band-h{margin:12px 12px 0;border-radius:28px;background:#120F38;overflow:hidden;position:relative;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 40px 80px -50px rgba(18,15,56,.9)}
.band-h::before,.band-h::after{content:"";position:absolute;border-radius:50%;filter:blur(80px);pointer-events:none}
.band-h::before{width:420px;height:420px;background:#7C5CFF;opacity:.45;right:-60px;top:-160px}
.band-h::after{width:320px;height:320px;background:var(--c,#FF8E72);opacity:.38;left:22%;bottom:-200px}
.band-h .wrap{max-width:1200px;padding-block:22px 30px}
.band-h h1{font-size:30px;line-height:1.15;margin:8px 0 10px}
.band-h p{color:#C9C5EA;font-size:14.5px;max-width:60ch}
.band-h .eyebrow{color:#E9C98B}
.band-h .illo{opacity:.9;width:180px}
.subnav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.subnav button{font:600 13px var(--text);padding:8px 15px;border-radius:999px;color:#CFCBEF;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.subnav button[aria-current="page"]{background:#fff;color:#1A1640;box-shadow:inset 0 1px 0 #fff,0 6px 16px -8px rgba(0,0,0,.5)}
footer{margin:40px 12px 12px;border-radius:24px}

/* home */
.hx{margin:12px;border-radius:28px;background:#120F38;color:#fff;position:relative;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 40px 80px -50px rgba(18,15,56,.9)}
.glow{position:absolute;border-radius:50%;filter:blur(80px);pointer-events:none}
.hx-in{position:relative;max-width:1240px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:32px;padding:44px 40px 40px;align-items:center}
.hx h1{font-size:40px;line-height:1.12;margin:16px 0 14px;color:#fff}
.hx h1 span{background:linear-gradient(90deg,#FFC2AF,#F3A6E0);-webkit-background-clip:text;background-clip:text;color:transparent}
.hx p{color:#C9C5EA;font-size:15px;line-height:1.7;max-width:44ch;margin:0 0 22px}
.dg{background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.18);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.hx-tag{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;font-size:12px;color:#E7E3FF}
.hx-tag i{width:6px;height:6px;border-radius:50%;background:#E9C98B;box-shadow:0 0 10px #E9C98B}
.hx-stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.hx-stats button{border-radius:16px;padding:10px 14px;text-align:left;color:#fff}
.hx-stats b{display:block;font-size:18px}.hx-stats small{font-size:11px;color:#B5B0E2}
.arches{position:relative;height:400px}
.arch{position:absolute;bottom:0;border-radius:110px 110px 22px 22px;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 30px 50px -28px rgba(0,0,0,.7)}
.arch img{position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:96%;width:auto;max-width:none;display:block}
.arch-tag{position:absolute;border-radius:16px;padding:9px 14px;display:flex;align-items:center;gap:10px;color:#1A1640;background:var(--glass);box-shadow:var(--shadow)}
.strip{position:relative;border-top:1px solid rgba(255,255,255,.08);padding:16px 40px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;justify-content:center;font-size:13px;color:#DCD8F5;letter-spacing:.05em}
.strip .eyebrow{color:#E9C98B}
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:16px}
.door2{display:flex;flex-direction:column;gap:8px;padding:22px;text-align:left;color:var(--ink);transition:transform .2s}
.door2:hover{transform:translateY(-3px)}
.door2 b{font-size:15.5px;margin-top:6px}.door2 small{font-size:13.5px;color:var(--muted);line-height:1.55}.door2 em{font-style:normal;margin-top:6px;font-size:12.5px;font-weight:600}
.orb{display:grid;place-items:center;border-radius:50%;flex:none;box-shadow:inset 0 2px 0 rgba(255,255,255,.85),inset 0 -6px 12px rgba(0,0,0,.05),0 10px 20px -12px rgba(40,25,120,.4)}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:26px 12px;padding:28px 18px}
.person{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;color:var(--ink)}
.ringp{width:108px;height:108px;border-radius:50%;overflow:hidden;position:relative;box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 14px 26px -16px rgba(40,25,120,.6);margin-bottom:6px}
.ringp img{position:absolute;inset:6px 0 0 0;width:100%;height:calc(100% - 6px);object-fit:cover;object-position:50% 8%;display:block}
.person b{font-size:13px}.person .co{font-size:12px;font-weight:600}.person small{font-size:11px;color:var(--muted)}
.seg2{display:flex;gap:4px;padding:4px;border-radius:999px}
.seg2 button{font:600 12px var(--text);border-radius:999px;padding:7px 13px;color:var(--body)}
.seg2 button[aria-pressed="true"]{color:#fff;background:linear-gradient(180deg,#2E2868,#15123F);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.tracks{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:16px;padding:24px 18px}
.tracks button{display:flex;flex-direction:column;align-items:center;gap:10px;font-size:12.5px;font-weight:600;color:var(--ink);text-align:center}
.isle-band{margin-top:56px;border-radius:28px;background:#120F38;color:#fff;position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(260px,.8fr) minmax(0,1.4fr);align-items:stretch;min-height:440px;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 40px 80px -50px rgba(18,15,56,.9)}
.isle-band .copy{position:relative;z-index:3;padding:34px 36px;display:flex;flex-direction:column;gap:12px;justify-content:center}
.isle-band h2{font-size:22px;margin:0}.isle-band p{color:#C9C5EA;font-size:14px;margin:0}
.isle-band .isle-host{position:relative;min-height:440px}
.isle-band .isle-mount{position:absolute;inset:0}
.cta-band{margin-top:56px;border-radius:28px;padding:30px 34px;display:flex;gap:22px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:linear-gradient(120deg,rgba(255,236,229,.95),rgba(241,236,255,.88))!important}

/* noticeboard */
.ntag{display:inline-flex;font:600 10.5px var(--text);letter-spacing:.12em;text-transform:uppercase;padding:4px 9px;border-radius:999px}
.watch{border-radius:24px;background:#120F38;color:#fff;padding:22px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 30px 60px -40px rgba(18,15,56,.9)}
.watch .w{border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:5px}
.watch .w b{font-size:14.5px}.watch .w span{font-size:13px;color:#CFCBEF}
.nrow{display:grid;grid-template-columns:52px minmax(0,1fr);gap:16px;padding:16px 18px;border-radius:20px}
.nrow .d{text-align:center;line-height:1.05}.nrow .d b{display:block;font-size:22px}.nrow .d small{font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--muted)}
.nrow h3{font:700 15px var(--text);letter-spacing:0;text-transform:none;margin:6px 0 4px}
.nrow p{margin:0;font-size:13.5px;color:var(--body)}
.nrow.past{opacity:.6}

/* drives board */
.kan{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px;align-items:start}
.col{border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:12px;background:rgba(236,232,250,.65);box-shadow:inset 0 1px 0 rgba(255,255,255,.8)}
.col-h{display:flex;align-items:center;gap:10px;padding:6px 6px 0}
.col-h h2{font-size:13px;margin:0}.col-h span{margin-left:auto;font:700 12px var(--text);background:#fff;border-radius:999px;padding:3px 10px}
.col p{margin:0 6px;font-size:12px;color:var(--muted)}
.dcard{display:flex;flex-direction:column;gap:12px;padding:16px;text-align:left;color:var(--ink);border-radius:18px;background:var(--glass);box-shadow:var(--shadow);position:relative}
.dcard:hover{transform:translateY(-2px)}
.dcard b{font-size:14.5px}.dcard small{font-size:12px;color:var(--muted);line-height:1.4}
.stops{display:flex;align-items:center}
.stops i{flex:none;width:13px;height:13px;border-radius:50%;box-sizing:border-box}
.stops em{flex:1;height:3px}
.dcard .nx{font-size:12.5px;color:var(--body);border-top:1px solid var(--line2);padding-top:10px}
.todo{border-radius:24px;background:#120F38;color:#fff;padding:26px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:22px;position:relative;overflow:hidden}
.todo h2{font-size:22px;margin:6px 0 8px;text-transform:none;letter-spacing:0;line-height:1.3}
.metro{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,1fr);overflow-x:auto;padding:6px 2px 4px}
.metro .st{display:flex;flex-direction:column;gap:10px}
.metro .ln{display:flex;align-items:center}
.metro .ln i{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--text);font-style:normal;box-sizing:border-box}
.metro .ln em{flex:1;height:4px}
.metro .tx{padding-right:14px;display:flex;flex-direction:column;gap:3px}
.metro .tx small{font:700 11px var(--text);letter-spacing:.1em}
.metro .tx b{font-size:14px;line-height:1.35}.metro .tx span{font-size:12.5px;color:var(--muted)}

/* readiness */
.stages{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px}
.stages button{width:100%;display:flex;gap:14px;align-items:center;padding:16px;border-radius:20px;text-align:left;color:var(--ink);background:var(--glass);box-shadow:var(--shadow)}
.stages button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px #13827B,var(--shadow)}
.stages .n{font:300 38px/1 var(--text)}
.bar{height:6px;border-radius:3px;background:#E7E6F0;overflow:hidden;display:block}.bar i{display:block;height:6px;border-radius:3px;background:linear-gradient(90deg,#34C6A8,#13827B)}
.ticks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:10px}
.tick{display:flex;align-items:flex-start;gap:12px;padding:13px 15px;border-radius:16px;text-align:left;color:var(--ink);background:rgba(255,255,255,.75);box-shadow:inset 0 0 0 1px var(--line)}
.tick .bx{flex:none;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;box-shadow:inset 0 0 0 2px #C9C6E0;margin-top:1px}
.tick[aria-pressed="true"]{background:linear-gradient(180deg,#F0FAF7,#E3F5EF);box-shadow:inset 0 0 0 1px #BFE3DC}
.tick[aria-pressed="true"] .bx{background:linear-gradient(180deg,#34C6A8,#13827B);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.tick b{font-size:13.5px;font-weight:600;display:block}.tick small{font-size:12px;color:var(--muted);display:block}
.flips{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px}
.flip{min-height:170px;border-radius:20px;padding:20px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:10px;color:#fff;background:linear-gradient(160deg,#4F73E0,#2849A8);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 20px 40px -26px rgba(40,73,168,.8)}
.flip .n{font:300 34px/1 var(--text);opacity:.7}.flip b{font-size:16px;line-height:1.35}
.flip[aria-pressed="true"]{background:var(--glass);color:var(--ink);box-shadow:inset 0 0 0 2px #4F73E0,var(--shadow)}
.flip[aria-pressed="true"] .n{color:#2849A8;font:600 11px var(--text);letter-spacing:.2em;opacity:1;text-transform:uppercase}
.flip span{font-size:13.5px;line-height:1.6}

/* learn + alumni */
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.tcard{display:flex;flex-direction:column;gap:12px;padding:22px;text-align:left;color:var(--ink);border-radius:22px;background:var(--glass);box-shadow:var(--shadow)}
.tcard b{font-size:16px}.tcard p{margin:0;font-size:13.5px;color:var(--muted)}
.tcard ul{margin:0;padding:12px 0 0;border-top:1px solid var(--line2);list-style:none;display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--body)}
.tcard li{display:flex;gap:8px;align-items:center}.tcard li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.pcard{display:flex;flex-direction:column;gap:10px;padding:20px;border-radius:22px;background:var(--glass);box-shadow:var(--shadow);text-align:left;color:var(--ink)}
.pcard b{font-size:15px;line-height:1.4}.pcard p{margin:0;font-size:13px;color:var(--body);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.by{display:flex;align-items:center;gap:10px;padding-top:10px;border-top:1px solid var(--line2);font-size:12px;color:var(--muted)}
.ini{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:700 11px var(--text);color:#5A36E0;background:linear-gradient(180deg,#F1ECFF,#D7CBFF);flex:none}
.mcard{display:flex;flex-direction:column;align-items:center;gap:10px;padding:24px 18px;border-radius:24px;background:var(--glass);box-shadow:var(--shadow);text-align:center}
.mcard .rg{width:92px;height:92px;border-radius:50%;padding:5px;box-sizing:border-box}.mcard .rg span{width:100%;height:100%;border-radius:50%;background:#fff;display:grid;place-items:center;font:700 22px var(--text);color:#6E6A90}
.prose2{font-size:14px;line-height:1.75;color:var(--body)}.prose2 h4{font:700 15px var(--text);margin:14px 0 6px;color:var(--ink)}.prose2 ul,.prose2 ol{padding-left:20px}
.files{display:flex;flex-direction:column;gap:8px}
.file{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 1px var(--line2);color:var(--ink)}
.file .ext{width:34px;height:40px;border-radius:6px;display:grid;place-items:center;font:700 10px var(--text);flex:none}
.drop{border:1.5px dashed #BDB2F0;border-radius:16px;background:linear-gradient(180deg,rgba(243,239,255,.7),rgba(255,255,255,.6));padding:16px;display:flex;align-items:center;gap:14px;cursor:pointer}
.drop.over{border-color:#6446EE;background:#F1ECFF}
.comp{display:grid;grid-template-columns:220px minmax(0,1fr) 290px;gap:0;min-height:100%}
.comp>aside:first-child{padding:4px 16px 4px 0;border-right:1px solid var(--line2);display:flex;flex-direction:column;gap:7px}
.comp>section{padding:0 22px;min-width:0}
.comp>aside:last-child{padding:0 0 0 20px;border-left:1px solid var(--line2);display:flex;flex-direction:column;gap:16px}
.ty{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:14px;background:rgba(255,255,255,.7);box-shadow:inset 0 0 0 1px var(--line2);font:600 12.5px var(--text);color:var(--body);text-align:left}
.ty[aria-pressed="true"]{background:linear-gradient(180deg,#F3EFFF,#E4DBFF);color:#4A32C7;box-shadow:inset 0 1px 0 #fff,0 0 0 1.5px #8F76FF}
.tb{display:flex;gap:4px;padding:6px 8px;border-bottom:1px solid var(--line2)}
.tb button{min-width:30px;height:28px;border-radius:8px;font:700 12.5px var(--text);color:var(--body)}.tb button:hover{background:var(--soft)}
.wa-prev{border-radius:20px;padding:14px;background:#E9E1D6}
.wa-prev div{background:#D9FDD3;border-radius:14px 4px 14px 14px;padding:12px 14px;font-size:13px;line-height:1.55;color:#111B21;white-space:pre-line;box-shadow:0 1px 1px rgba(0,0,0,.08)}
@media (max-width:980px){.comp{grid-template-columns:1fr}.comp>aside:first-child{flex-direction:row;flex-wrap:wrap;border:0;padding:0 0 14px}.comp>section{padding:0}.comp>aside:last-child{border:0;padding:16px 0 0}.isle-band{grid-template-columns:1fr}.isle-band .isle-host{min-height:420px}}
@media (max-width:720px){.hx-in{padding:28px 20px}.hx h1{font-size:28px}.arches{height:300px}.band-h h1{font-size:24px}.strip{padding:14px 18px}.band-h .illo{display:none}.top{margin:8px 8px 0}.band-h,.hx{margin:10px 8px 0}}
.band-h .wrap{display:block}
.bh{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center}
@media (max-width:720px){.bh{grid-template-columns:1fr}}
@keyframes upl{from{transform:translateX(-30%)}to{transform:translateX(90%)}}
.isle-band .isle-hint{bottom:18px}
.isle-band .isle-stage.flat .isle-pins{inset:auto 0 24px 0}
.band-h .row .chip{font-size:12px}
.tabbar{margin-top:18px;border-bottom-color:var(--line)}
.tabbar button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--coral)}
.clbar{border:0!important;border-radius:999px;padding:6px 8px}
.clbar button{border-radius:999px}
.clbar button[aria-pressed="true"]{background:linear-gradient(180deg,#2E2868,#15123F);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.search{border-radius:999px!important;background:rgba(255,255,255,.85)!important;border-color:var(--line)!important}
@media (max-width:560px){.wall{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 6px;padding:20px 8px}.ringp{width:78px;height:78px}.person b{font-size:11.5px}.person .co{font-size:11px}.person small{font-size:10px}.doors{gap:10px}.door2{padding:16px}}
.arches .arch:nth-child(1){height:75%!important}.arches .arch:nth-child(2){height:92%!important}.arches .arch:nth-child(3){height:80%!important}
.arch img{height:92%}
.top .wrap{padding-block:14px}.brand b{font-size:16px}.brand small{font-size:11px}.brand img{width:48px;height:48px}
.nav button{font-size:14.5px;padding:9px 16px}.top .btn{font-size:14px;padding:11px 18px}
@media (max-width:760px){.brand small{display:none}.brand b{font-size:14px;letter-spacing:.1em}.brand img{width:40px;height:40px}.top .btn{font-size:13px;padding:9px 13px}}
@media (max-width:480px){.brand b{font-size:12.5px}.top .btn.coral span{display:none}.top .btn{padding:9px 11px}}
html.in-site{--bg:#FFFFFF}html.in-site,html.in-site body{background:#FFFFFF}
body{font-size:15.5px}.hx h1{font-size:44px}.hx p{font-size:16.5px}.hx-tag{font-size:13px}.hx-stats b{font-size:20px}.hx-stats small{font-size:12px}
.top{border-radius:26px}.top .wrap{padding-block:18px;padding-inline:26px}.brand b{font-size:17.5px}.brand small{font-size:11.5px}.brand img{width:54px;height:54px}
.nav{padding:5px}.nav button{font-size:15.5px;padding:10px 18px}.top .btn{font-size:15px;padding:12px 20px}
@media (max-width:760px){.top .wrap{padding-block:12px;padding-inline:14px}.brand b{font-size:14px}.brand img{width:40px;height:40px}.top .btn{font-size:13px;padding:9px 13px}.hx h1{font-size:30px}.hx p{font-size:15.5px}}
@media (max-width:480px){.top .wrap{padding-inline:10px}.brand b{font-size:12.5px;letter-spacing:.06em}.brand img{width:34px;height:34px}.top .btn{padding:8px 10px}}
.sprog{position:fixed;left:0;top:0;height:3px;width:100%;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,#FF8A65,#F3A6E0,#9A82FF);z-index:200;pointer-events:none}
.rv{opacity:0;transform:translateY(22px) scale(.985);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
.dock{position:fixed;right:18px;top:50%;transform:translate(140%,-50%);z-index:150;display:flex;flex-direction:column;gap:4px;padding:8px;border-radius:22px;background:rgba(18,15,56,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 24px 50px -20px rgba(18,15,56,.7);transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .3s;opacity:0}
.dock.show{transform:translate(0,-50%);opacity:1}
.dock button{position:relative;display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:14px;background:transparent;color:#CFCBEF;cursor:pointer;transition:background .2s,color .2s}
.dock button:hover,.dock button.on{background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.06));color:#fff}

const CONFIG={api:"https://script.google.com/macros/s/AKfycbxbYe57GAGcyop4wnb2hXn_0XFIPcCNrhoXaMVZ9pdWskcsJ_peujypDgHXzS6uQN9Pww/exec",site:"https://mssw-career-hub.github.io",gid:"368935374295-70jpbr7pt6aufrtsjhngobik8m6m8mba.apps.googleusercontent.com",domain:"mssw.in"};

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const MON=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const todayISO=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const isoPlus=n=>{const d=new Date(Date.now()+n*864e5);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const dOf=iso=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(iso||"");return m?new Date(+m[1],m[2]-1,+m[3]):null};
const nice=iso=>{const d=dOf(iso);return d?d.getDate()+" "+MONTHS[d.getMonth()].slice(0,3)+" "+d.getFullYear():""};
const ago=t=>{const s=(Date.now()-new Date(t))/1e3;if(s<3600)return Math.max(1,Math.round(s/60))+" min ago";if(s<86400)return Math.round(s/3600)+" hr ago";const d=Math.round(s/86400);return d<30?d+" days ago":nice(new Date(t).toISOString())};
const hash=s=>{let h=7;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return h};
const initials=n=>String(n||"?").trim().split(/\s+/).map(x=>x[0]).join("").slice(0,2).toUpperCase();

  if(a==="google"){if(!b.confirm)return{need:true,name:"Preview Person",email:"preview@mssw.in",mssw:true};return previewApi("verify",{...b,email:"preview@mssw.in",code:"123456"})}
  if(a==="verify"){if(String(b.code).trim()!=="123456")throw new Error("That code didn't match. In this preview the code is 123456.");const mssw=/@mssw\.in$/i.test(b.email);const team=/^umashaan25@mssw\.in$/i.test(b.email)||TEAM.some(t=>t.email===String(b.email).toLowerCase());return{me:{id:"p1",key:"k",name:b.name,role:mssw?b.role:"Alumni",programme:b.programme,batch:b.batch,mssw,team,owner:/^umashaan25@/i.test(b.email)}}}

    if(b.id)Object.assign(RAW.notices.find(n=>n.id===b.id),rec);else RAW.notices.unshift({id,t:now,by:ME.name,...rec});applyAccess();return{id:b.id||id}}

    if(b.id)Object.assign(RAW.drives.find(d=>d.id===b.id),rec);else RAW.drives.unshift({id,t:now,...rec});applyAccess();return{id:b.id||id}}

  if(a==="journey"){if((b.company||"").length<2||(b.role||"").length<2)throw new Error("Add the organisation and your role.");RAW.journeys.unshift({id,t:now,name:b.showName?ME.name:"",memberRole:ME.role,status:b.status,company:b.company,role:b.role,sector:b.sector,location:b.location,ctc:b.showCtc?+b.ctc||"":"",route:b.route,programme:b.programme,batch:b.batch,rounds:b.rounds,questions:b.questions,prep:b.prep,advice:b.advice,helpful:0,qa:[],mine:true});return{id}}

  if(a==="resource"){if((b.title||"").length<3)throw new Error("Add a title.");if(!/^https?:\/\//.test(b.link||""))throw new Error("Add a link that starts with https://");RAW.resources.unshift({id,t:now,by:ME.name,title:b.title,kind:b.kind,topic:b.topic,link:b.link,about:b.about,helpful:0,mine:true});applyAccess();return{id}}

function go(v){if(v==="openings")v="drives";if(!views().some(x=>x[0]===v))v="home";view=v;resetF();$("#nav").classList.remove("open");$("#menuBtn").setAttribute("aria-expanded","false");nav();render();window.scrollTo({top:0})}
function render(){({home:renderHome,notices:renderNotices,drives:renderDrives,readiness:renderReadiness,openings:renderDrives,companies:renderCompanies,journeys:renderJourneys,events:renderEvents,resources:renderResources,desk:renderDesk}[view])();paintMe();nav()}
const secH=(t,k,more,sub)=>`<div class="sec-h"><div class="t">${k?sq(k,17):""}<div><h2>${t}</h2>${sub?`<p>${sub}</p>`:""}</div></div>${more?`<button class="link" data-go="${more[0]}">${more[1]} ${ic("arrow",14)}</button>`:""}</div>`;
const sampleNote=()=>"";
const needed=(title,text,form,btn)=>`<div class="empty"><span class="need">Data needed</span><b>${title}</b>${text}${form?`<div style="margin-top:12px"><button class="btn coral small" data-form="${form}">${btn}</button></div>`:""}</div>`;
function band(k,eyebrow,title,text,actions){return `<section class="band-h" style="--c:${CAT[k][2]}"><div class="wrap"><div><span class="eyebrow">${eyebrow}</span><h1>${title}</h1><p>${text}</p>${actions?`<div class="row">${actions}</div>`:""}</div>${illo(k)}</div></section>`}
function readinessRing(size=140){const n=readyN(),tot=READY_ITEMS.length,C=2*Math.PI*52;
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg viewBox="0 0 120 120"><circle class="bgc" cx="60" cy="60" r="52"/><circle class="fg" cx="60" cy="60" r="52" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-n/tot)}"/></svg><div class="t"><span><b>${n}/${tot}</b><small>${n===tot?"All set!":"Complete"}</small></span></div></div>`}

/* READINESS: dashboard with sticky progress and document tables */
function renderReadiness(){const n=readyN(),tot=READY_ITEMS.length;let tpls=D.resources.filter(r=>r.topic==="Resume"&&r.kind==="Template").slice(0,4);
  if(!tpls.length)tpls=[["Classic one-page (MSSW format)","Works for most roles. Start here."],["Development sector & NGO programmes","Leads with field impact."],["HR & people roles","Shows HR process knowledge and results."],["Research, data & M&E","Puts methods and evidence first."]].map(([t,a])=>({title:t,about:a,link:"",pending:true}));
  const next=READY_ITEMS.find(i=>!DONE.has(i[0])&&i[3]==="Must")||READY_ITEMS.find(i=>!DONE.has(i[0]));
  $("#main").innerHTML=band("ready","Readiness centre","Get placement ready","Everything recruiters ask for, in one checklist: identity and academic documents, your profile, practice and eligibility. Tick items as you finish them."+(ME?" Your progress is saved to your profile.":" Sign in to keep your progress on your profile."))+
  `<div class="wrap"><div class="dash">
   <aside class="dash-side"><div class="panel progress">${readinessRing(160)}<b style="font-family:var(--head);text-transform:uppercase;letter-spacing:.06em;font-size:.88rem">${n===tot?"You're placement ready":n>=tot*.6?"Almost there":n>=tot*.25?"Good progress":"Let's get started"}</b>
     <span class="muted" style="font-size:.86rem">${next?"Next: "+next[1]:"Go apply, then share your journey."}</span></div>
    <nav class="panel cats" aria-label="Checklist sections"><button data-jump="guide"><span><b>Placement rules</b></span><span class="muted">${PLACEMENT_RULES.length}</span></button>${READY.map(([k,t,i,items])=>{const d=items.filter(x=>DONE.has(x[0])).length;return `<button data-jump="r-${k}"><span>${t}</span><span class="meter"><em style="width:${d/items.length*100}%"></em></span></button>`}).join("")}</nav></aside>
   <div>
    <section class="studio"><div class="studio-top"><div><h3>Resume studio</h3><p>Start from a proven template, then make it yours. Recruiters notice resumes that are tailored to their role, show numbers and fit on one page. Each template opens as your own Google Doc copy.</p></div>${illo("studio")}</div>
     <div class="tpl">${tpls.map(t=>{const inner=`<span class="page"><i></i><i></i><i></i><i class="c"></i><i></i><i></i><i class="c"></i><i></i></span><b>${esc(t.title.replace(/^Resume template · /,""))}</b><small>${esc(t.about||"")}</small><span class="chip fill" style="--c:var(--c-res);align-self:flex-start">${t.link?"Make a copy":"Being set up"}</span>`;
      return t.link?`<a href="${esc(t.link)}" target="_blank" rel="noopener">${inner}</a>`:`<div>${inner}</div>`}).join("")}</div>
     <div class="tips"><div><b>Make it fit</b>Mirror the words in the job description and move your most relevant experience to the top.</div><div><b>Show results</b>Start each bullet with an action verb and add a number: people reached, surveys done, time saved.</div><div><b>Keep it clean</b>One page, one font, consistent dates. Save as PDF named Firstname-Lastname-Resume.</div></div></section>
    <section class="guide" id="guide"><div class="guide-h"><span class="sq" style="--c:var(--c-co)">${ic("shield",17)}</span><div><h3>How campus placements work at MSSW</h3><p>The rules that came up again and again this season, in one place.</p></div></div>
     <ol>${PLACEMENT_RULES.map(([t,b])=>`<li><b>${esc(t)}</b><span>${esc(b)}</span></li>`).join("")}</ol></section>
    ${READY.map(([k,t,i,items])=>{const d=items.filter(x=>DONE.has(x[0])).length;return `<section class="rtable" id="r-${k}" style="--c:var(--c-ready)"><div class="head"><span class="sq" style="--c:var(--c-ready)">${ic(i,17)}</span><h3>${t}</h3><span>${d} of ${items.length}</span></div>

function gsiOn(){return !!CONFIG.gid&&(PREVIEW||location.origin===CONFIG.site)}
function loadGsi(cb){if(window.google&&google.accounts&&google.accounts.id)return cb();const s=document.createElement("script");s.src="https://accounts.google.com/gsi/client";s.async=true;s.onload=cb;s.onerror=()=>{const w=document.getElementById("gWrap");if(w)w.hidden=true};document.head.appendChild(s)}

  const {body,close}=drawer("Sign in",`<h2>Sign in</h2><p style="color:var(--body);margin:0" id="siLead">${G?"One tap with your Google account. No password, and it remembers you on every device.":"No password. We email you a 6-digit code."}</p>
   ${G?`<div id="gWrap" class="gwrap"><div id="gBtn"></div><p class="hint" style="margin:8px 0 0">Use your <b>@${CONFIG.domain}</b> account for this season's drives and notices. Alumni can use any Google account.</p><div class="orline"><span>or get a code by email</span></div></div>`:""}

   <form id="siF"><div id="s1"><label class="lab" for="siName">Your name</label><input class="field" id="siName" maxlength="60" autocomplete="name">

    <div id="siMore"><span class="lab">I am</span><div class="pick" id="siRole">${["Student","Alumni","Faculty"].map((r,i)=>`<button type="button" data-v="${r}" aria-pressed="${i===0}">${r}</button>`).join("")}</div></div>
    <div class="two"><div><label class="lab" for="siProg">Programme <small>(optional)</small></label><input class="field" id="siProg" list="progList" maxlength="60"><datalist id="progList">${PROGRAMMES.map(p=>`<option value="${p}">`).join("")}</datalist></div><div><label class="lab" for="siBatch">Batch <small>(year you graduate)</small></label><input class="field" id="siBatch" inputmode="numeric" maxlength="4" placeholder="2026"></div></div></div>
    <div id="s2" hidden><label class="lab" for="siCode">Enter the 6-digit code we emailed you${PREVIEW?" (preview: 123456)":""}</label><input class="field" id="siCode" inputmode="numeric" maxlength="6" style="font-size:1.3rem;letter-spacing:.3em;max-width:220px"><p class="hint">Can't see it? Check spam. The code works for 15 minutes.</p></div>
    <p class="err" id="siErr" role="alert"></p><button class="btn primary" id="siGo">Email me a code</button></form>`);
  let role="Student";const roleEl=body.querySelector("#siRole");const err=body.querySelector("#siErr");const goB=body.querySelector("#siGo");
  async function done(r){ME=r.me;store.set("mch-me",ME);applyAccess();close();afterSignIn();toast("Welcome, "+ME.name.split(" ")[0]+"!");
    if(!PREVIEW&&DONE.size)api("readiness",{items:[...DONE]}).catch(()=>{});await refresh();then&&then()}
  async function onCred(resp){err.textContent="";cred=resp&&resp.credential||"";if(!cred)return;
    try{const r=await api("google",{cred});if(r.me)return done(r);
      step=3;["#gWrap","#siLevels","#siEmailBox"].forEach(q=>body.querySelector(q).style.display="none");
      body.querySelector("#siLead").innerHTML="Welcome! You're signing in as <b>"+esc(r.email)+"</b>. Tell us a little about you, just this once.";

    catch(x){err.textContent=x.message}}
  if(G){const gb=body.querySelector("#gBtn");
    if(PREVIEW){gb.innerHTML=`<button type="button" class="gfake">Continue with Google</button>`;gb.firstChild.onclick=()=>onCred({credential:"preview"})}
    else loadGsi(()=>{try{google.accounts.id.initialize({client_id:CONFIG.gid,callback:onCred,ux_mode:"popup",auto_select:false,cancel_on_tap_outside:true});
      google.accounts.id.renderButton(gb,{theme:"filled_blue",size:"large",shape:"pill",text:"continue_with",logo_alignment:"left",width:Math.max(220,Math.min(340,gb.clientWidth||300))})}catch(x){body.querySelector("#gWrap").hidden=true}})}
  roleEl.addEventListener("click",e=>{const b=e.target.closest("[data-v]");if(!b)return;role=b.dataset.v;roleEl.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b))});

function pickHtml(id,opts,sel,multi){return `<div class="pick" id="${id}" data-multi="${multi?1:0}">${opts.map(o=>`<button type="button" data-v="${esc(o)}" aria-pressed="${multi?sel.includes(o):sel===o}">${esc(o)}</button>`).join("")}</div>`}
function wirePick(body,id){const el=body.querySelector("#"+id);el.addEventListener("click",e=>{const b=e.target.closest("[data-v]");if(!b)return;el.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b))})}
const picked=(body,id)=>[...body.querySelectorAll("#"+id+" [aria-pressed='true']")].map(b=>b.dataset.v);
function orderPick(body,id){const order=[];body.querySelector("#"+id).addEventListener("click",e=>{const b=e.target.closest("[data-v]");if(!b)return;const v=b.dataset.v;const i=order.indexOf(v);if(i>-1)order.splice(i,1);else order.push(v);b.setAttribute("aria-pressed",i<0)});return order}

function jLabels(st){const k=st.status;
  if(k==="Started a venture")return {co:"Venture name",ro:"Your role",roPh:"Founder, Co-founder",lo:"Based in",route:false,rLab:"",r2:null,q:"What you wish you had known before starting",qPh:"e.g. How long registration takes, finding your first customers",p:"How it started",pPh:"The idea, your first steps, who helped you",step2:"2 · The story"};
